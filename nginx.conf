# Serve the PWA under /blockpuzzle/ (all asset paths in index.html/sw.js are
# relative, so the sub-path works as-is). Cache rules follow the hub's
# stale-cache lessons: HTML/sw/manifest/scripts always revalidate (there are
# no hashed filenames here), icons cache a week.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz { add_header Content-Type text/plain; return 200 'ok'; }
  location = / { return 302 /blockpuzzle/; }
  location = /blockpuzzle { return 301 /blockpuzzle/; }

  location ^~ /blockpuzzle/icons/ { add_header Cache-Control "public, max-age=604800"; }

  # sw.js especially must stay fresh for PWA updates to roll out.
  location /blockpuzzle/ {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /blockpuzzle/index.html;
  }
}
